name: greatnote
description: "Handwriting-focused tablet notes for Android tablets and iPads."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.2"

dependencies:
  args: ^2.7.0
  flutter:
    sdk: flutter
  gpt_markdown: ^1.3.4
  http: ^1.6.0
  path_provider: ^2.1.6
  file_picker: 13.1.0
  image_picker: 1.2.4
  image: 4.12.0
  pdf: 3.13.1
  pdfrx: 2.4.8
  share_plus: 13.3.1
  speech_to_text: ^7.5.0
  record: ^7.1.2
  just_audio: ^0.10.6
  cupertino_icons: ^2.0.0
  google_sign_in: ^7.2.0
  crypto: ^3.0.7
  in_app_purchase: ^3.3.1
  supabase_flutter: ^2.18.3
  flutter_secure_storage: ^10.3.4
  flutter_svg: ^2.2.1
  path_parsing: ^1.1.0
  xml: ^7.0.1
  sign_in_with_apple: ^8.2.0

executables:
  postzen:

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  # Host side of the profiling harness in test_driver/.
  flutter_driver:
    sdk: flutter
  leak_tracker_flutter_testing: any
  flutter_lints: ^6.0.0
  # Drives timers in unit tests; the version is the one the SDK pins.
  fake_async: any
  # Regenerates the platform app icons: dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  # Inter is the UI face and Newsreader the editorial display face; both are
  # variable fonts licensed under the SIL OFL (assets/fonts/OFL-*.txt).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader.ttf
  assets:
    - third_party/ems_readability/OFL.txt
    - assets/fonts/OFL-Inter.txt
    - assets/fonts/OFL-Newsreader.txt
    - assets/icon/etonia.png
    - assets/icons/navigation/
    - assets/icons/library/
    - assets/icons/tools/
    - assets/icons/actions/
    - assets/icons/system/
    # Etonia's clips (12 fps; 12 frames = 1 s, grade is 24); see tool/etonia_rig.
    - assets/animations/etonia_loops/ui/look_around/
    - assets/animations/etonia_loops/ui/think/
    - assets/animations/etonia_loops/ui/hop/
    - assets/animations/etonia_loops/ui/write/
    - assets/animations/etonia_loops/ui/run/
    - assets/animations/etonia_loops/ui/pop_out/
    - assets/animations/etonia_loops/ui/attend/
    - assets/animations/etonia_loops/ui/grade/

flutter_launcher_icons:
  image_path: assets/icon/etonia.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#FAE6FF"
  adaptive_icon_foreground: assets/icon/etonia.png
