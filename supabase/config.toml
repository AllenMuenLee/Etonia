project_id = "etonia"

[functions.billing]
verify_jwt = false

[functions.ai]
verify_jwt = false

[functions.embed]
verify_jwt = false

[functions.store-events]
verify_jwt = false

[functions.analytics]
verify_jwt = false

# Each function validates its own user token or webhook credential. This also
# supports the current Supabase publishable keys and asymmetric user JWTs.

[auth]
# Devices that have not signed in with Google get an anonymous account on the
# free plan. Enable the same setting in the dashboard (Auth > Sign In / Providers).
enable_anonymous_sign_ins = true
# Lets Google and Apple sign-in upgrade a device's anonymous account in place.
enable_manual_linking = true

# Native Sign in with Apple on iPhone and iPad: the app's bundle ID is the
# client ID, and no secret is needed. Enable the same in the dashboard
# (Auth > Sign In / Providers > Apple).
[auth.external.apple]
enabled = true
client_id = "com.etonia.app"
secret = ""
