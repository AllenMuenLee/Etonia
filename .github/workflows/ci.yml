name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Installs the Flutter version pinned in .fvmrc.
      - uses: kuhnroyal/flutter-fvm-config-action/setup@v3
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test --exclude-tags golden

  goldens:
    name: Golden tests
    # Baselines are rendered on Windows; compare on the same platform so
    # anti-aliasing differences cannot cause false failures.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: kuhnroyal/flutter-fvm-config-action/setup@v3
      - run: flutter pub get
      - run: flutter test --tags golden
      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: '**/failures/*.png'

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: kuhnroyal/flutter-fvm-config-action/setup@v3
      - run: flutter pub get
      - run: flutter build apk --debug

  ios:
    name: iOS simulator build
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: kuhnroyal/flutter-fvm-config-action/setup@v3
      - run: flutter pub get
      # A simulator build is unsigned, so no certificates or secrets are used.
      - run: flutter build ios --simulator
