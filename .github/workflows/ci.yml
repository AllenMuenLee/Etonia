name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Installs the Flutter version pinned in .fvmrc.
      - uses: kuhnroyal/flutter-fvm-config-action/setup@v3
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test --exclude-tags golden
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Supabase functions
        run: deno check --config supabase/functions/deno.json supabase/functions/ai/index.ts supabase/functions/billing/index.ts supabase/functions/store-events/index.ts
      - name: Test private billing and AI boundary
        run: deno test --allow-read --allow-env --config supabase/functions/deno.json supabase/tests

  goldens:
    name: Golden tests
    # Baselines are rendered on Windows; compare on the same platform so
    # anti-aliasing differences cannot cause false failures.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: kuhnroyal/flutter-fvm-config-action/setup@v3
      - run: flutter pub get
      - run: flutter test --tags golden
      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: '**/failures/*.png'

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # A debug APK carries unstripped native libraries (Flutter, ML Kit,
      # Jetpack Ink, pdfium) for four ABIs, which fills the stock runner's
      # disk during mergeDebugNativeLibs. Remove toolchains this job never
      # uses; the Android SDK and Java stay.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc \
            /usr/local/.ghcup /usr/local/share/boost /usr/share/swift \
            /usr/local/share/powershell /usr/local/share/chromium \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go \
            /opt/hostedtoolcache/PyPy /opt/hostedtoolcache/Ruby
          sudo docker image prune --all --force > /dev/null || true
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: kuhnroyal/flutter-fvm-config-action/setup@v3
      - run: flutter pub get
      - run: flutter build apk --debug

  ios:
    name: iOS simulator build
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: kuhnroyal/flutter-fvm-config-action/setup@v3
      - run: flutter pub get
      # A simulator build is unsigned, so no certificates or secrets are used.
      - run: flutter build ios --simulator
